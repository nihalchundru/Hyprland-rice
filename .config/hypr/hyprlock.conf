# ── Date ──────────────────────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color       = $lock_acc
    font_size   = 75
    font_family = JetBrainsMono Nerd Font, Inter, Sans-Serif
    position    = 0, 120
    halign      = center
    valign      = center
}

# ── Password input ────────────────────────────────────────────────────────────
input-field {
    monitor           =
    size              = 450, 90
    outline_thickness = 3
    dots_size         = 0.28
    dots_spacing      = 0.45
    dots_center       = true
    outer_color       = $lock_acc
    inner_color       = $lock_bg
    font_color        = $lock_fg
    fail_color        = rgb(CC241D)
    fade_on_empty     = false
    placeholder_text  = <i>Enter Password...</i>
    font_family       = JetBrainsMono Nerd Font, Inter, Sans-Serif
    hide_input        = false
    position          = 0, -60
    halign            = center
    valign            = center
}

# ── Weather card (background shape) ──────────────────────────────────────────
shape {
    monitor      =
    size         = 400, 75
    color        = rgba(26172299)
    rounding     = 14
    border_size  = 1
    border_color = rgba(D2B29355)
    position     = 0, -175
    halign       = center
    valign       = center
}

# ── Weather text ──────────────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:300000] bash ~/.config/hypr/scripts/hyprlock-weather.sh
    color       = $lock_fg
    font_size   = 25
    font_family = JetBrainsMono Nerd Font, Sans-Serif
    position    = 0, -175
    halign      = center
    valign      = center
}

# ── Media card (background shape) ────────────────────────────────────────────
shape {
    monitor      =
    size         = 400, 75
    color        = rgba(26172299)
    rounding     = 14
    border_size  = 1
    border_color = rgba(D2B29355)
    position     = 0, -275
    halign       = center
    valign       = center
}

# ── Media icon ────────────────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:3000] playerctl status 2>/dev/null | grep -q Playing && echo "󰎆" || echo "󰝚"
    color       = $lock_acc
    font_size   = 25
    font_family = JetBrainsMono Nerd Font
    position    = -160, -275
    halign      = center
    valign      = center
}

# ── Media title ───────────────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:3000] TITLE=$(playerctl metadata title 2>/dev/null | head -c 28); ARTIST=$(playerctl metadata artist 2>/dev/null | head -c 20); [ -n "$TITLE" ] && echo "$TITLE$([ -n \"$ARTIST\" ] && echo \" — $ARTIST\")" || echo "Nothing playing"
    color       = $lock_fg
    font_size   = 22
    font_family = JetBrainsMono Nerd Font, Sans-Serif
    position    = 30, -275
    halign      = center
    valign      = center
}
