# HyDE ARM keybindings
# Using ALT as mainMod to avoid Mac keyboard conflicts

$mainMod = ALT
$TERMINAL = kitty
$EXPLORER = thunar
$BROWSER = zen-browser
#$NOTES = flatpak run com.logseq.Logseq
# ── Window management ─────────────────────────────────────────────────────────
bind = $mainMod, Q,      killactive
bind = $mainMod SHIFT, F,      togglefloating
#bind = $mainMod, G,      togglegroup
bind = SHIFT,    F11,    fullscreen
bind = $mainMod, F,      fullscreen, 0

# ── Apps ──────────────────────────────────────────────────────────────────────
bind = $mainMod, Return, exec, kitty
bind = $mainMod, E,      exec, $EXPLORER
bind = $mainMod, B,      exec, $BROWSER
bind = $mainMod, D,      exec, bash ~/.config/hypr/scripts/launcher.sh
#bind = $mainMod SHIFT, N, exec, flatpak run com.logseq.Logseq
#bind = $mainMod SHIFT, M,      exec, missioncenter
#bind = $mainMod SHIFT, M, exec, btop
bind = $mainMod, Tab, exec, snappy-switcher toggle
# ── HyDE controls ─────────────────────────────────────────────────────────────
bind = $mainMod, T,            exec, bash ~/.config/hypr/scripts/theme-switch.sh
bind = $mainMod, W,            exec, bash ~/.config/hypr/scripts/wallpaper-switcher.sh
bind = $mainMod SHIFT, W,      exec, bash -c 'THEME=$(cat ~/.config/hypr/themes/current-name); WALL=$(find ~/.config/hypr/wallpapers/$THEME -type f \( -iname "*.png" -o -iname "*.jpg" \) | shuf -n 1); bash ~/.config/hypr/scripts/swww.sh "$WALL"'
bind = $mainMod, L, exec, bash ~/.config/hypr/scripts/lock.sh
bind = CTRL ALT, Delete,       exec, bash ~/.config/hypr/scripts/powermenu.sh
bind = $mainMod, N,            exec, swaync-client -t
bind = $mainMod, bracketleft,  exec, qs
bind = $mainMod, I,            exec, bash ~/.config/hypr/scripts/hypridle-timeout-switcher.sh
# ── Focus ─────────────────────────────────────────────────────────────────────
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = ALT,      Tab,   exec, hyprctl --batch "dispatch cyclenext ; dispatch alterzorder top"

# ── Move windows ──────────────────────────────────────────────────────────────
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# ── Resize ────────────────────────────────────────────────────────────────────
binde = $mainMod CTRL, right, resizeactive,  30 0
binde = $mainMod CTRL, left,  resizeactive, -30 0
binde = $mainMod CTRL, up,    resizeactive,  0 -30
binde = $mainMod CTRL, down,  resizeactive,  0  30

# ── Workspaces ────────────────────────────────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# ── Screenshots ───────────────────────────────────────────────────────────────
bind = ,      Print, exec, grim ~/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png && notify-send "HyDE" "Screenshot saved"
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png
bind = CTRL,  Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "HyDE" "Screenshot copied"

# ── Volume ────────────────────────────────────────────────────────────────────
bind = , XF86AudioRaiseVolume, exec, bash ~/.config/hypr/scripts/volume.sh --inc
bind = , XF86AudioLowerVolume, exec, bash ~/.config/hypr/scripts/volume.sh --dec
bind = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioPlay,        exec, playerctl play-pause
bind = , XF86AudioNext,        exec, playerctl next
bind = , XF86AudioPrev,        exec, playerctl previous

# ── Mouse ─────────────────────────────────────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, P, exec, bash ~/.config/hypr/scripts/layout-switcher.sh

# Layout switcher
bind = $mainMod, P, exec, bash ~/.config/hypr/scripts/layout-switcher.sh

bind = $mainMod SHIFT, B, exec, bash ~/.config/hypr/scripts/bar-switch.sh
# Layout switcher (adapts to active bar)
bind = $mainMod, P, exec, bash ~/.config/hypr/scripts/layout-switcher.sh

bind = $mainMod SHIFT, C, exec, bash ~/.config/hypr/scripts/corner-switcher.sh









# Quickshell sidebar
bind = $mainMod, A, exec, qs ipc call sidebar toggle 
bind = $mainMod, X, exec, bash ~/.config/hypr/scripts/control-panel.sh
bind = $mainMod SHIFT, D, exec, bash ~/.config/hypr/scripts/rofi-layout-switcher.sh
bind = $mainMod SHIFT, P, exec, bash ~/.config/hypr/scripts/powermenu-layout-switcher.sh
bind = $mainMod SHIFT, S, exec, bash ~/.config/hypr/scripts/picker-style-switcher.sh
bind = $mainMod SHIFT, T, exec, bash ~/.config/hypr/scripts/transition-switcher.sh

# Keybinds popup
bind = $mainMod, M, exec, qs ipc -c ~/.config/quickshell/keybinds call keybinds toggle

# Transition length switcher
bind = $mainMod SHIFT, L, exec, bash ~/.config/hypr/scripts/transition-length-switcher.sh
bind = $mainMod SHIFT, N, exec, bash ~/.config/hypr/scripts/night-shift.sh

# Clipboard history
bind = $mainMod, V,       exec, bash ~/.config/hypr/scripts/clipboard-picker.sh
bind = $mainMod SHIFT, V, exec, bash ~/.config/hypr/scripts/clipboard-delete.sh

# Shell switcher (always available, even in Ambxst mode via keybindings-ambxst.conf)
bind = $mainMod CTRL, S, exec, bash ~/.config/hypr/scripts/shell-switch.sh
# This will toggle ScrollOverview when SUPER+g is pressed
#bind = SUPER, g, scrolloverview:overview, toggle
# Scratchpad terminal
#bind = $mainMod, grave, exec, bash ~/.config/hypr/scripts/scratchpad.sh

bind = $mainMod, O, exec, qs ipc -c overview call overview toggle
#bind = $mainMod, O, exec, qs ipc -c ~/.config/quickshell/overview call overview toggle
bind = $mainMod SHIFT, O, exec, qs ipc -c ~/.config/quickshell/settings call settings toggle
bind = $mainMod SHIFT, M, exec, bash ~/.config/hypr/scripts/theme-mode-switcher.sh
bind = $mainMod SHIFT, A, exec, bash ~/.config/hypr/scripts/applet.sh
bind = $mainMod SHIFT, G, exec, bash ~/.config/hypr/scripts/matugen-mode-switcher.sh
bind = $mainMod SHIFT, K, exec, bash ~/.config/hypr/scripts/lockscreen-switcher.sh

bind = SUPER, D,      exec, bash ~/.config/hypr/scripts/rofi-shell-switch.sh
