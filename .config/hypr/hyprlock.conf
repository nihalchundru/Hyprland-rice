# =============================================================================
# HyDE ARM — hyprlock.conf (enhanced)
# VMware: llvmpipe + immediate_render
# Widgets: digital clock + analog clock + password + weather + media
# =============================================================================

source = ~/.config/hypr/assets/extracted_colors.conf

general {
    disable_loading_bar  = true
    hide_cursor          = true
    grace                = 0
    no_fade_in           = true
    no_fade_out          = true
    immediate_render     = true
    fractional_scaling   = true
}

# ── Background ────────────────────────────────────────────────────────────────
background {
    monitor      =
    path         = ~/.config/hypr/assets/current_wallpaper.png
    color        = $lock_bg
    blur_passes  = 0
    blur_size    = 0
    crossfade    = false
    zindex       = -1
}

# ── Digital clock (left of center) ───────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:1000] echo "$TIME12"
    color       = $lock_fg
    font_size   = 160
    font_family = JetBrainsMono Nerd Font, Inter Display, Sans-Serif
    position    = 0, 300
    halign      = center
    valign      = center
}

