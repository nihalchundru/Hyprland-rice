# ~/.config/hypr/tide_island_binds.conf
# Adapted for VMware Fusion (using ALT instead of SUPER/macOS shortcuts)

bind = ALT, TAB, exec, /usr/bin/quickshell ipc --any-display -p /usr/share/tide-island call overview toggle
bind = ALT, right, exec, /usr/bin/quickshell ipc --any-display -p /usr/share/tide-island call tide swipeRight
bind = ALT, left, exec, /usr/bin/quickshell ipc --any-display -p /usr/share/tide-island call tide swipeLeft
bind = ALT, down, exec, /usr/bin/quickshell ipc --any-display -p /usr/share/tide-island call tide showClock
bind = ALT, M, exec, /usr/bin/quickshell ipc --any-display -p /usr/share/tide-island call tide togglePlayer
bind = ALT, C, exec, /usr/bin/quickshell ipc --any-display -p /usr/share/tide-island call tide toggleControlCenter
bind = ALT, N, exec, /usr/bin/quickshell ipc --any-display -p /usr/share/tide-island call tide toggleNotificationCenter
bind = ALT SHIFT, G, exec, /usr/bin/quickshell ipc --any-display -p /usr/share/tide-island call tide toggleWallpaperPicker
bind = ALT, slash, exec, /usr/bin/quickshell ipc --any-display -p /usr/share/tide-island call tide toggleApplicationLauncher
bind = ALT, F, exec, /usr/bin/quickshell ipc --any-display -p /usr/share/tide-island call island toggle
