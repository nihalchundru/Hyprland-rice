# Crimson Twilight — Hyprland theme config
# Cinematic anime, dramatic dusk

general {
    col.active_border   = rgba(E64A45ff) rgba(B84E60ff) 45deg
    col.inactive_border = rgba(1A1116ff)
    border_size         = 2
    gaps_in             = 6
    gaps_out            = 12
}

decoration {
    rounding            = 14
    active_opacity      = 1.0
    inactive_opacity    = 0.96

    blur {
        enabled           = true
        size              = 8
        passes            = 3
        vibrancy          = 0.15
        vibrancy_darkness = 0.1
        contrast          = 0.9
        brightness        = 0.85
        noise             = 0.008
        new_optimizations = true
        xray              = false
    }

    shadow {
        enabled        = true
        range          = 20
        render_power   = 3
        color          = rgba(E64A4530)
        color_inactive = rgba(1A111688)
    }
}
