# cava config for the Quickshell visualizer.
#
# `method = raw` + `raw_target = /dev/stdout` makes cava print one frame per
# line as `v0;v1;v2;...;` so Quickshell can parse it with a SplitParser.
#
# Keep `bars` and `ascii_max_range` in sync with the values in Cava.qml
# (bars is only a hint — the QML renders however many bars cava actually sends).

[general]
framerate = 60
bars = 48
autosens = 1

[input]
# Uncomment and adjust if cava picks the wrong device.
# For PipeWire/PulseAudio:
# method = pulse
# source = auto
# For a monitor of a specific sink (visualize system output):
#   source = alsa_output.pci-0000_00_1f.3.analog-stereo.monitor

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
channels = mono
mono_option = average

[smoothing]
noise_reduction = 30
