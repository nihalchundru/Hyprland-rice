# HyDE ARM — hyprland.conf
# VMware Fusion aarch64
#env = PATH,$HOME/.local/bin:$PATH

# ── Allow Native SVGA Atomic Modesetting ─────────────────────────────────────
# DO NOT set NO_ATOMIC or ALLOW_SOFTWARE here. Let it run natively.
#env = AQ_DRM_DEVICES,/dev/dri/card0
#env = WLR_RENDERER,gles2

# ── Force the Toolkits to match the SVGA Hardware Context ────────────────────
#env = GDK_BACKEND,wayland
#env = QT_QPA_PLATFORM,wayland
#env = KITTY_DISABLE_WAYLAND,0

# ── Safe Mesa Core Profile Injection ─────────────────────────────────────────
#env = MESA_GL_VERSION_OVERRIDE,3.3
#env = MESA_GLSL_VERSION_OVERRIDE,330
#env = QT_QUICK_BACKEND,opengl

# ── Hardware Cursor Toggle (Keep this one enabled for VM syncing) ────────────
#env = WLR_NO_HARDWARE_CURSORS,1


# ── Identify and Force the Physical VMware SVGA Card ────────────────────────
#env = AQ_DRM_DEVICES,/dev/dri/card0:/dev/dri/renderD128
#env = AQ_NO_KMS_REQUIREMENT,1

# ── Force Mesa to use the Hardware SVGA Translation Layer ─
# ── VMware ARM software rendering ─────────────────────────────────────────────
#env = WLR_RENDERER,pixman
env = WLR_RENDERER_ALLOW_SOFTWARE,1
env = WLR_DRM_NO_ATOMIC,1
env = LIBGL_ALWAYS_SOFTWARE,1
env = WLR_NO_HARDWARE_CURSORS,1
#env = PATH,$HOME/.local/share/vm-wrappers:$PATH

#export PATH="$HOME/.local/bin:$PATH"

# ── Wayland env ───────────────────────────────────────────────────────────────
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11,*
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice

# ── Sourced configs (HyDE structure) ─────────────────────────────────────────
source = ~/.config/hypr/themes/theme.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/current_profile_binds.conf
#source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/userprefs.conf
source = ~/.config/hypr/layerrules.conf
# ── Autostart ─────────────────────────────────────────────────────────────────
exec-once = bash ~/.config/hypr/scripts/startup.sh
exec-once = swaync
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --watch cliphist store
exec-once = nm-applet --indicator
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = qs -c ~/.config/quickshell
exec-once = qs -c ~/.config/quickshell/keybinds
exec-once = hypridle
#exec-once = qs -c ~/.config/quickshell/applets
#exec-once = qs -c ~/.config/quickshell/theme-switcher
#exec-once = qs -c ~/.config/quickshell/wallpaper-picker
#exec-once = qs -c ~/.config/quickshell/launcher
# Zen live theme watcher
exec-once = /home/nihal/.config/zen/scripts/zen-css-watch.sh
exec-once = sh -c "echo 'waybar' > ~/.config/hypr/bar/active-bar"
exec-once = qs -c overview
